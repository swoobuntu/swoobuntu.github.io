<svg viewBox="0 0 900 510" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Malgun Gothic', sans-serif" role="img">
<title>리소스별 서브넷 7종 · NACL 1:1 · SG 인아웃 제한</title>
<desc>7개 서브넷 각각에 NACL이 1:1로 붙고, 내부 보안그룹이 인바운드와 아웃바운드를 모두 제한하는 구조</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 z" fill="#6B4FBB"/></marker>
</defs>

<text x="40" y="30" font-size="19" font-weight="bold" fill="#232F3E">리소스별 서브넷 7종 · NACL 1:1 · SG 인·아웃 양방향 제한</text>
<text x="40" y="50" font-size="12.5" fill="#5A6B7B">요청 흐름(좌) · WAS 아웃바운드 목적지(우) — 각 서브넷 = 전용 NACL + 자체 SG</text>

<!-- ===== LEFT COLUMN: request flow chain ===== -->
<!-- Card1 Public -->
<rect x="40" y="66" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
<rect x="52" y="76" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="81" y="91" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="120" y="92" font-size="15" font-weight="bold" fill="#232F3E">Public (ELB)</text>
<rect x="52" y="104" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="58" y="110" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="71" y="121" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="92" y="119" font-size="10.5" fill="#1E7A46">IN ← Internet :80 / 443</text>
<text x="92" y="135" font-size="10.5" fill="#2563EB">OUT → WEB :80</text>

<!-- Card2 WEB -->
<rect x="40" y="166" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
<rect x="52" y="176" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="81" y="191" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="120" y="192" font-size="15" font-weight="bold" fill="#232F3E">WEB</text>
<rect x="52" y="204" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="58" y="210" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="71" y="221" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="92" y="219" font-size="10.5" fill="#1E7A46">IN ← Pub-ELB :80</text>
<text x="92" y="235" font-size="10.5" fill="#2563EB">OUT → 내부ALB :8080 · VPCE :443</text>

<!-- Card3 ELB-Internal -->
<rect x="40" y="266" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
<rect x="52" y="276" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="81" y="291" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="120" y="292" font-size="15" font-weight="bold" fill="#232F3E">ELB-Internal</text>
<rect x="52" y="304" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="58" y="310" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="71" y="321" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="92" y="319" font-size="10.5" fill="#1E7A46">IN ← WEB :8080</text>
<text x="92" y="335" font-size="10.5" fill="#2563EB">OUT → WAS :8080</text>

<!-- Card4 WAS -->
<rect x="40" y="366" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="2"/>
<rect x="52" y="376" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="81" y="391" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="120" y="392" font-size="15" font-weight="bold" fill="#232F3E">WAS</text>
<rect x="52" y="404" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="58" y="410" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="71" y="421" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="92" y="419" font-size="10.5" fill="#1E7A46">IN ← 내부ALB :8080</text>
<text x="92" y="435" font-size="10.5" fill="#2563EB">OUT → DB :3309 · Redis :6379 · VPCE :443</text>

<!-- chevrons between left cards -->
<text x="230" y="163" font-size="15" fill="#94A3B8" text-anchor="middle">▼</text>
<text x="230" y="263" font-size="15" fill="#94A3B8" text-anchor="middle">▼</text>
<text x="230" y="363" font-size="15" fill="#94A3B8" text-anchor="middle">▼</text>

<!-- connector WAS -> right group -->
<polyline points="420,408 450,408 450,150 476,150" fill="none" stroke="#6B4FBB" stroke-width="2" marker-end="url(#ah)"/>
<text x="480" y="112" font-size="11.5" font-weight="bold" fill="#6B4FBB">WAS 아웃바운드 목적지 ↓</text>

<!-- ===== RIGHT COLUMN: destinations ===== -->
<!-- Card5 DB -->
<rect x="480" y="120" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
<rect x="492" y="130" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="521" y="145" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="560" y="146" font-size="15" font-weight="bold" fill="#232F3E">DB (RDS)</text>
<rect x="492" y="158" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="498" y="164" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="511" y="175" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="532" y="173" font-size="10.5" fill="#1E7A46">IN ← WAS :3309</text>
<text x="532" y="189" font-size="10.5" fill="#C77700">OUT → 기본(전체) · 말단</text>

<!-- Card6 Redis -->
<rect x="480" y="220" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
<rect x="492" y="230" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="521" y="245" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="560" y="246" font-size="15" font-weight="bold" fill="#232F3E">Redis</text>
<rect x="492" y="258" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="498" y="264" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="511" y="275" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="532" y="273" font-size="10.5" fill="#1E7A46">IN ← WEB · WAS :6379</text>
<text x="532" y="289" font-size="10.5" fill="#C77700">OUT → 기본(전체) · 말단</text>

<!-- Card7 Endpoint -->
<rect x="480" y="320" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
<rect x="492" y="330" width="58" height="22" rx="6" fill="#2E7D9E"/><text x="521" y="345" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">NACL</text>
<text x="560" y="346" font-size="15" font-weight="bold" fill="#232F3E">Endpoint (VPCE)</text>
<rect x="492" y="358" width="356" height="38" rx="6" fill="#F7FAFC" stroke="#CBD5E0"/>
<rect x="498" y="364" width="26" height="15" rx="3" fill="#6B4FBB"/><text x="511" y="375" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">SG</text>
<text x="532" y="373" font-size="10.5" fill="#1E7A46">IN ← WEB · WAS · Mon :443</text>
<text x="532" y="389" font-size="10.5" fill="#C77700">OUT → 기본(전체) · 말단</text>

<!-- ===== LEGEND ===== -->
<rect x="40" y="466" width="820" height="34" rx="8" fill="#F4F7FB" stroke="#D9E2EC"/>
<rect x="56" y="476" width="14" height="14" rx="3" fill="#2E7D9E"/><text x="76" y="488" font-size="11.5" fill="#334155">NACL = 서브넷 경계 (Stateless · 1:1)</text>
<rect x="330" y="476" width="14" height="14" rx="3" fill="#6B4FBB"/><text x="350" y="488" font-size="11.5" fill="#334155">SG = 인스턴스 (Stateful · 인·아웃 양방향)</text>
<rect x="650" y="476" width="14" height="14" rx="3" fill="#C77700"/><text x="670" y="488" font-size="11.5" fill="#334155">기본(전체) = 말단 미제한</text>
</svg>
